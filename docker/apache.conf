ServerName localhost
SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on
<Directory /var/www/html>
    Options -Indexes
    AllowOverride None
    <FilesMatch "^(config\.php|composer\..*|.*\.(sql|txt|json)|cron_reminders\.php|sms_queue\.php|sms_helper\.php)$">
        Require all denied
    </FilesMatch>
</Directory>
<Directory /var/www/html/uploads>
    AllowOverride None
    php_admin_flag engine off
    <FilesMatch "(?i)\.(php[0-9]?|phtml|phar)(\.|$)">
        Require all denied
    </FilesMatch>
</Directory>
<Directory /var/www/html/uploads/documents>
    Require all denied
</Directory>
<Directory /var/www/html/vendor>
    Require all denied
</Directory>
