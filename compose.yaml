name: malife
services:
  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      BASE_URL: ${BASE_URL:-https://malifehs.arofi.net}
      DB_HOST: db
      DB_USER: malife
      DB_NAME: malife
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      SMS_MODE: ${SMS_MODE:-production}
      SMS_PROD_USERNAME: ${SMS_PROD_USERNAME:-}
      SMS_PROD_API_KEY: ${SMS_PROD_API_KEY:-}
      SMS_SANDBOX_USERNAME: ${SMS_SANDBOX_USERNAME:-}
      SMS_SANDBOX_API_KEY: ${SMS_SANDBOX_API_KEY:-}
    ports:
      - "127.0.0.1:${APP_PORT:-18941}:80"
    volumes:
      - uploads:/var/www/html/uploads
      - app_state:/var/lib/malife
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: malife
      MYSQL_USER: malife
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u malife malife -Nse 'SELECT COUNT(*) FROM users'"]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  uploads:
  app_state:
  db_data:
